<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>À propos — Portail Portfolio</title>
    <link rel="stylesheet" href="../assets/css/about/about.css">
</head>
<body>

    <section class="contact">
        <div class="main-container">
            <div class="contact-bg">
                <h2>Laissez-nous un message</h2>

                <div class="flex">
                    <!-- Gauche -->
                    <div class="contact-info">
                        <div class="contact-content">
                            <div class="box">
                                <i class="fa-solid fa-at"></i>
                                <a href="#">adressemailfictive@gmail.com</a>
                            </div>
                            <div class="box">
                                <i class="fa-solid fa-mobile"></i>
                                <a href="#">Tel : +241 11239056</a>
                            </div>
                        </div>
                    </div>

                    <!-- Droite -->
                    <div class="contact-form">
                        <div class="form-group">
                            <label>Nom</label>
                            <input type="text" placeholder="Entrez votre nom ici"/>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="Entrez votre adresse email ici"/>
                        </div>
                        <div class="form-group">
                            <label>Contact</label>
                            <input type="tel" placeholder="Entrez votre numéro ici"/>
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea placeholder="Entrez votre message ici"></textarea>
                        </div>
                        <button type="button">Envoyer</button>
                    </div>
                </div>

                <div class="contact-logo">
                    <a href="#"> <span class="span">Portail</span> Portfolio </a>
                </div>
            </div>
        </div>    

    </section>

</body>
</html>
