<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>À propos — Portail Portfolio</title>
    <link rel="stylesheet" href="../assets/css/about/about.css">
</head>
<body>

   <section id="about-contact">
  <div class="contact-container">
    <h2>Laissez-nous un message</h2>

    <div class="contact-content">
      <!-- Gauche -->
      <div class="contact-left">
        <div class="contact-info">
          <div class="contact-info-bottom">
            <p class="contact-email">adressemailfictive@gmail.com</p>
            <p class="contact-tel">Tel : +241 11239056</p>
          </div>
        </div>
        <p class="contact-logo"><span>PORTAIL</span> Portfolio</p>
      </div>

      <!-- Droite -->
      <div class="contact-form">
        <div class="form-group">
          <label>Nom</label>
          <input type="text" placeholder="Entrez votre nom ici"/>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" placeholder="Entrez votre adresse email ici"/>
        </div>
        <div class="form-group">
          <label>Contact</label>
          <input type="tel" placeholder="Entrez votre numéro ici"/>
        </div>
        <div class="form-group">
          <label>Message</label>
          <textarea placeholder="Entrez votre message ici"></textarea>
        </div>
        <button type="button">Envoyer</button>
      </div>
    </div>
  </div>
</section>
</body>
</html>
